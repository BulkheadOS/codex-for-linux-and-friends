name: Upstream Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # Pinned from actions/setup-node@v4.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh upstream metadata
        run: bash scripts/update-upstream-metadata.sh
      - name: Create update pull request
        if: ${{ !cancelled() }}
        # Pinned from peter-evans/create-pull-request@v7.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          commit-message: "chore: refresh upstream codex app metadata"
          title: "Refresh upstream Codex app metadata"
          body: |
            Automated metadata refresh for the official Codex app DMG URLs.

            This PR updates only header-derived metadata. It does not download,
            attach, or redistribute upstream app binaries.
          branch: automation/upstream-codex-app-metadata
          delete-branch: true
